[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-hook-mia"
requires-python = ">=3.11,<3.15"
# Keep setup.py authoritative for the version, base dependencies, package
# discovery, and vLLM plugin entry points.
dynamic = ["version", "dependencies", "entry-points"]

[project.optional-dependencies]
metal = ["vllm-metal==0.2.0"]

[dependency-groups]
test = ["pytest"]
