name: Repository Translation

on:
  pull_request:
    paths:
      - .github/workflows/repository-translation.yml
      - .github/scripts/translation/**
      - .github/translation/**
      - .github/translation-validators/**
      - tests/workflows/translation/**
  workflow_dispatch:
    inputs:
      stage:
        description: Use run on GitHub; separate stages are for local act
        type: choice
        options: [run, prepare, discover, retrieve, freeze, translate, evaluate, summary, finish]
        default: run
      condition:
        description: Supplied graphs; both requires publication and runtime validation off
        type: choice
        options: [no-graph, graph, both]
        default: no-graph
      validator_profile:
        description: Independent CPU/Metal runtime validation profile
        default: .github/translation-validators/attention_tracker/profile.json
      runtime_validation:
        description: Require CPU versus Mac/Metal runtime comparison before publishing
        type: boolean
        default: true
      create_draft_pr:
        description: Publish completed deliverables only; reuse the draft for this condition and base
        type: boolean
        default: true
      pr_base:
        description: Destination branch for the draft
        default: main
      manifest:
        description: Repository/platform translation settings; no example-specific tests
        default: .github/translation/manifest.json
      run_dir:
        description: Optional persistent directory; leave blank for a unique one-run directory
        default: ''
      pilot:
        description: Permit Auto model routing, explicitly labeled as a pilot
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  protocol-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generic translation boundaries and isolated publication
        run: python -m unittest discover -s tests/workflows/translation -p 'test_*.py'
      - name: Exercise both draft bundles without a model or inference
        run: python tests/workflows/translation/smoke_delivery.py --output "$RUNNER_TEMP/translation-smoke"
      - name: Upload offline delivery fixtures
        uses: actions/upload-artifact@v4
        with:
          name: translation-delivery-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/translation-smoke/*/bundle/**
            ${{ runner.temp }}/translation-smoke/*/report.json
          if-no-files-found: error
          retention-days: 7

  hosted-setup-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the same tools and library sources as a hosted translation
        run: .github/scripts/translation/setup-hosted.sh
      - name: Verify preparation and both frozen contexts without model usage
        shell: bash
        run: |
          set -euo pipefail
          for stage in prepare discover retrieve freeze; do
            "$TRANSLATION_PYTHON" .github/scripts/translation/run.py --stage "$stage" --run-dir "$RUNNER_TEMP/hosted-preparation" --target-site "$TRANSLATION_TARGET_SITE"
          done
      - name: Upload hosted setup evidence
        uses: actions/upload-artifact@v4
        with:
          name: translation-hosted-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/translation-hosted/bootstrap/environment.json
            ${{ runner.temp }}/translation-hosted/bootstrap/sources/source-provenance.json
            ${{ runner.temp }}/hosted-preparation/protocol.json
            ${{ runner.temp }}/hosted-preparation/results.json
          if-no-files-found: error
          retention-days: 7

  experiment:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # Generation reads target sources and does not need target hardware.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      bundle_ready: ${{ steps.bundle.outputs.ready }}
      evidence_url: ${{ steps.evidence.outputs.artifact-url }}
    steps:
      - name: Checkout translation tools
        if: ${{ !env.ACT }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false
      - uses: actions/setup-python@v5
        if: ${{ !env.ACT }}
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ !env.ACT }}
        with:
          node-version: '22'
      - name: Check hosted configuration
        if: ${{ !env.ACT }}
        shell: bash
        env:
          TRANSLATION_STAGE: ${{ inputs.stage }}
          CONDITION: ${{ inputs.condition }}
          RUNTIME_REQUIRED: ${{ inputs.runtime_validation }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ vars.TRANSLATION_WANDB_ENTITY }}
          WANDB_PROJECT: ${{ vars.TRANSLATION_WANDB_PROJECT }}
        run: |
          set -euo pipefail
          [[ "$TRANSLATION_STAGE" == "run" ]] || { echo '::error::Hosted runners are fresh machines. Use stage=run; separate stages are for local act.'; exit 1; }
          [[ "$CONDITION" != "both" || "$RUNTIME_REQUIRED" != "true" ]] || { echo '::error::Choose one condition per runtime comparison, or turn runtime_validation off for a generation-only pair.'; exit 1; }
          [[ -n "$COPILOT_GITHUB_TOKEN" ]] || { echo '::error::Add repository Actions secret COPILOT_GITHUB_TOKEN.'; exit 1; }
          [[ -n "$WANDB_API_KEY" ]] || { echo '::error::Add repository Actions secret WANDB_API_KEY for required trial logging.'; exit 1; }
          [[ -n "$WANDB_ENTITY" && -n "$WANDB_PROJECT" ]] || { echo '::error::Set TRANSLATION_WANDB_ENTITY and TRANSLATION_WANDB_PROJECT repository variables.'; exit 1; }
      - name: Prepare hosted tools and target source context
        if: ${{ !env.ACT }}
        shell: bash
        env:
          TRANSLATION_MANIFEST: ${{ inputs.manifest }}
        run: .github/scripts/translation/setup-hosted.sh
      - name: Prepare isolated tracking tools
        if: ${{ env.ACT && (inputs.stage == 'run' || inputs.stage == 'translate' || inputs.stage == 'finish' || inputs.stage == 'evaluate' || inputs.stage == 'summary') }}
        shell: bash
        env:
          TRANSLATION_LOCAL_REPO: ${{ vars.TRANSLATION_LOCAL_REPO }}
        run: |
          if [[ "${ACT:-}" == "true" ]]; then cd "$TRANSLATION_LOCAL_REPO"; fi
          python3 -m venv "$RUNNER_TEMP/translation-tools"
          "$RUNNER_TEMP/translation-tools/bin/python" -m pip install -r .github/translation/requirements-tracking.txt
          echo "TRANSLATION_PYTHON=$RUNNER_TEMP/translation-tools/bin/python" >> "$GITHUB_ENV"
      - name: Run repository translation stage
        id: experiment
        continue-on-error: true
        shell: bash
        env:
          TRANSLATION_CONDITION: ${{ inputs.condition }}
          VALIDATOR_PROFILE: ${{ inputs.validator_profile }}
          CREATE_DRAFT: ${{ inputs.create_draft_pr }}
          RUNTIME_VALIDATION: ${{ inputs.runtime_validation }}
          TRANSLATION_MANIFEST: ${{ inputs.manifest }}
          TRANSLATION_STAGE: ${{ inputs.stage }}
          TRANSLATION_REQUESTED_RUN_DIR: ${{ inputs.run_dir }}
          TRANSLATION_PILOT: ${{ inputs.pilot }}
          LOCAL_TARGET_SITE: ${{ vars.TRANSLATION_TARGET_SITE }}
          TRANSLATION_LOCAL_REPO: ${{ vars.TRANSLATION_LOCAL_REPO }}
          LOCAL_COPILOT_BIN: ${{ vars.TRANSLATION_COPILOT_BIN }}
          LOCAL_COPILOT_HOME: ${{ vars.TRANSLATION_COPILOT_HOME }}
          TRANSLATION_SOURCE_PYTHON: ${{ vars.TRANSLATION_SOURCE_PYTHON }}
          TRANSLATION_TARGET_PYTHON: ${{ vars.TRANSLATION_TARGET_PYTHON }}
          HF_HUB_CACHE: ${{ vars.TRANSLATION_MODEL_CACHE }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TRANSLATION_REQUIRE_WANDB: 'true'
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ vars.TRANSLATION_WANDB_ENTITY }}
          WANDB_PROJECT: ${{ vars.TRANSLATION_WANDB_PROJECT }}
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            cd "$TRANSLATION_LOCAL_REPO"
            export TRANSLATION_TARGET_SITE="$LOCAL_TARGET_SITE"
            export TRANSLATION_COPILOT_BIN="$LOCAL_COPILOT_BIN"
            export TRANSLATION_COPILOT_HOME="$LOCAL_COPILOT_HOME"
          fi
          run_dir="$TRANSLATION_REQUESTED_RUN_DIR"
          if [[ -z "$run_dir" ]]; then
            [[ "$TRANSLATION_STAGE" == "run" ]] || { echo 'A run_dir is required for separate stages'; exit 1; }
            run_dir="$RUNNER_TEMP/translation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "TRANSLATION_RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          if [[ "$CREATE_DRAFT" == "true" && "$TRANSLATION_CONDITION" == "both" ]]; then
            echo 'Choose graph or no-graph for a draft'; exit 1
          fi
          if [[ "${ACT:-}" != "true" && ( "$TRANSLATION_STAGE" == "prepare" || "$TRANSLATION_STAGE" == "run" ) ]]; then
            revision="$(python3 -c 'import json,os; print(json.load(open(os.environ["TRANSLATION_MANIFEST"]))["source_revision"])')"
            if ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
              [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
              git fetch --no-tags origin "$revision"
            fi
          fi
          args=(--stage "$TRANSLATION_STAGE" --run-dir "$run_dir" --manifest "$TRANSLATION_MANIFEST" --condition "$TRANSLATION_CONDITION")
          if [[ "$TRANSLATION_PILOT" == "true" ]]; then args+=(--pilot); fi
          if [[ -n "$TRANSLATION_TARGET_SITE" ]]; then args+=(--target-site "$TRANSLATION_TARGET_SITE"); fi
          if [[ "${ACT:-}" == "true" && "$RUNTIME_VALIDATION" == "true" && -n "$VALIDATOR_PROFILE" ]]; then args+=(--validator-profile "$VALIDATOR_PROFILE"); fi
          if [[ "$TRANSLATION_STAGE" == "run" || "$TRANSLATION_STAGE" == "finish" ]]; then
            if [[ "$CREATE_DRAFT" == "true" || "$RUNTIME_VALIDATION" == "true" ]]; then
              args+=(--prepare-pr "$RUNNER_TEMP/translation-pr")
            fi
          fi
          "${TRANSLATION_PYTHON:-python3}" .github/scripts/translation/run.py "${args[@]}"
      - name: Check publication bundle
        env:
          RUNTIME_REQUIRED: ${{ inputs.runtime_validation }}
        id: bundle
        if: ${{ always() && (inputs.stage == 'finish' || inputs.stage == 'run') && (inputs.create_draft_pr || inputs.runtime_validation) && !env.ACT }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/translation-pr/metadata.json" ]]; then
            python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'translation-pr/metadata.json'
          metadata = json.loads(path.read_text())
          metadata['runtime_validation_required'] = os.environ['RUNTIME_REQUIRED'] == 'true'
          path.write_text(json.dumps(metadata, indent=2) + '\n')
          PYTHON
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload selected candidate
        if: ${{ always() && steps.bundle.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: translation-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/translation-pr/
          if-no-files-found: error
      - name: Upload translation evidence
        id: evidence
        if: ${{ always() && !env.ACT && env.TRANSLATION_RUN_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: translation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TRANSLATION_RUN_DIR }}/no_graph/*.log
            ${{ env.TRANSLATION_RUN_DIR }}/graph/*.log
            ${{ env.TRANSLATION_RUN_DIR }}/no_graph/translation.patch
            ${{ env.TRANSLATION_RUN_DIR }}/graph/translation.patch
            ${{ env.TRANSLATION_RUN_DIR }}/*/*-result.json
            ${{ env.TRANSLATION_RUN_DIR }}/*/candidate/TRANSLATION.md
            ${{ env.TRANSLATION_RUN_DIR }}/*/candidate/translated_notebooks/**
            ${{ env.TRANSLATION_RUN_DIR }}/*/candidate/translation_discovery/**
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve failed generation or validation
        if: ${{ always() && steps.experiment.outcome == 'failure' }}
        run: exit 1

  runtime-validation:
    needs: experiment
    if: ${{ always() && inputs.runtime_validation && needs.experiment.result == 'success' && needs.experiment.outputs.bundle_ready == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            runner: ubuntu-22.04
          - backend: target
            runner: macos-15
    runs-on: ${{ matrix.backend == 'target' && vars.TRANSLATION_METAL_RUNNER || matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: translation-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/translation-pr
      - name: Execute independent backend fixture
        env:
          BACKEND: ${{ matrix.backend }}
          PROFILE: ${{ inputs.validator_profile }}
        run: |
          python3 .github/scripts/translation/hosted_runtime.py \
            --bundle "$RUNNER_TEMP/translation-pr" --profile "$PROFILE" \
            --backend "$BACKEND" --output "$RUNNER_TEMP/runtime-result"
      - name: Preserve backend result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: translation-runtime-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-result/result.json
            ${{ runner.temp }}/runtime-result/execution.log
          if-no-files-found: warn

  runtime-compare:
    needs: [experiment, runtime-validation]
    if: ${{ always() && inputs.runtime_validation && needs.experiment.result == 'success' && needs.experiment.outputs.bundle_ready == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.compare.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: translation-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/translation-pr
      - uses: actions/download-artifact@v4
        with:
          pattern: translation-runtime-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-results
      - name: Compare CPU and Metal and authorize publication
        id: compare
        env:
          PROFILE: ${{ inputs.validator_profile }}
        run: |
          python3 .github/scripts/translation/hosted_runtime.py \
            --bundle "$RUNNER_TEMP/translation-pr" --profile "$PROFILE" \
            --cpu "$RUNNER_TEMP/runtime-results/translation-runtime-cpu-${{ github.run_id }}-${{ github.run_attempt }}/result.json" \
            --target "$RUNNER_TEMP/runtime-results/translation-runtime-target-${{ github.run_id }}-${{ github.run_attempt }}/result.json" \
            --output "$RUNNER_TEMP/runtime-comparison.json"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: translation-runtime-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-comparison.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ steps.compare.outputs.ready == 'true' }}
        with:
          name: translation-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/translation-pr/

  publish:
    needs: [experiment, runtime-compare]
    if: ${{ always() && (inputs.stage == 'finish' || inputs.stage == 'run') && inputs.create_draft_pr && inputs.condition != 'both' && needs.experiment.result == 'success' && needs.experiment.outputs.bundle_ready == 'true' && (!inputs.runtime_validation || needs.runtime-compare.outputs.ready == 'true') }}
    concurrency:
      group: translation-publish-${{ inputs.pr_base }}-${{ inputs.condition }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.runtime_validation && 'translation-validated' || 'translation-pr' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/translation-pr
      - name: Open or update the completed translation draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ inputs.pr_base }}
          EVIDENCE_URL: ${{ needs.experiment.outputs.evidence_url }}
        run: |
          python3 .github/scripts/translation/publish_candidate.py \
            --bundle "$RUNNER_TEMP/translation-pr" \
            --repo "$GITHUB_REPOSITORY" --base "$PR_BASE" --artifact-url "$EVIDENCE_URL"
