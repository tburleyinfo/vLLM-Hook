name: Repository Translation

on:
  pull_request:
    paths:
      - .github/workflows/repository-translation.yml
      - .github/scripts/translation/**
      - .github/translation/**
      - tests/workflows/translation/**
  workflow_dispatch:
    inputs:
      stage:
        description: run prepares, generates and packages in one job; other stages resume a prepared run
        type: choice
        options: [run, prepare, baseline, discover, retrieve, freeze, translate, evaluate, summary, finish]
        default: run
      condition:
        description: Candidate to translate (both is research only)
        type: choice
        options: [no-graph, graph, both]
        default: no-graph
      run_tests:
        description: Run CPU and Metal validation (optional for draft generation)
        type: boolean
        default: false
      create_draft_pr:
        description: Open a draft for one candidate after finish
        type: boolean
        default: true
      pr_base:
        description: Destination branch for the draft
        default: main
      manifest:
        description: Frozen experiment configuration for prepare
        required: true
        default: .github/translation/attention_tracker/manifest.discovery.json
      run_dir:
        description: Optional persistent directory for staged runs; leave blank for a unique run directory
        required: false
        default: ''
      pilot:
        description: Label Auto model routing as pilot evidence
        required: true
        default: 'true'
      baseline_run:
        description: Optional prior passing CPU run; source, evaluator and settings must match
        required: false
        default: ''

permissions:
  contents: read

jobs:
  protocol-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check experiment protocol and isolated PR publication
        run: python -m unittest discover -s tests/workflows/translation -p 'test_*.py'
      - name: Exercise both draft bundles without a model or GPU
        run: python tests/workflows/translation/smoke_delivery.py --output "$RUNNER_TEMP/translation-smoke"
      - name: Upload offline delivery fixtures
        uses: actions/upload-artifact@v4
        with:
          name: translation-delivery-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/translation-smoke/*/bundle/**
            ${{ runner.temp }}/translation-smoke/*/report.json
          if-no-files-found: error
          retention-days: 7

  experiment:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # A native Apple Silicon host is required for actual Metal evaluation.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    outputs:
      bundle_ready: ${{ steps.bundle.outputs.ready }}
      evidence_url: ${{ steps.evidence.outputs.artifact-url }}
    steps:
      - name: Checkout experiment harness
        if: ${{ !env.ACT }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false
      - name: Prepare isolated tracking tools
        if: ${{ inputs.stage == 'run' || inputs.stage == 'translate' || inputs.stage == 'finish' || inputs.stage == 'evaluate' || inputs.stage == 'summary' }}
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/translation-tools"
          "$RUNNER_TEMP/translation-tools/bin/python" -m pip install -r .github/translation/requirements-tracking.txt
          echo "TRANSLATION_PYTHON=$RUNNER_TEMP/translation-tools/bin/python" >> "$GITHUB_ENV"
      - name: Run frozen experiment stage
        id: experiment
        continue-on-error: true
        shell: bash
        env:
          EXPERIMENT_CONDITION: ${{ inputs.condition }}
          RUN_TESTS: ${{ inputs.run_tests }}
          CREATE_DRAFT: ${{ inputs.create_draft_pr }}
          EXPERIMENT_MANIFEST: ${{ inputs.manifest }}
          EXPERIMENT_STAGE: ${{ inputs.stage }}
          EXPERIMENT_RUN_DIR: ${{ inputs.run_dir }}
          EXPERIMENT_PILOT: ${{ inputs.pilot }}
          EXPERIMENT_BASELINE_RUN: ${{ inputs.baseline_run }}
          ATTN_CPU_PYTHON: ${{ vars.ATTN_CPU_PYTHON }}
          ATTN_METAL_PYTHON: ${{ vars.ATTN_METAL_PYTHON }}
          ATTN_METAL_SITE: ${{ vars.ATTN_METAL_SITE }}
          ATTN_LOCAL_REPO: ${{ vars.ATTN_LOCAL_REPO }}
          HF_HUB_CACHE: ${{ vars.ATTN_MODEL_CACHE }}
          ATTN_COPILOT_BIN: ${{ vars.ATTN_COPILOT_BIN }}
          ATTN_COPILOT_HOME: ${{ vars.ATTN_COPILOT_HOME }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TRANSLATION_REQUIRE_WANDB: 'true'
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ vars.TRANSLATION_WANDB_ENTITY }}
          WANDB_PROJECT: ${{ vars.TRANSLATION_WANDB_PROJECT }}
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            cd "$ATTN_LOCAL_REPO"
          fi
          if [[ -z "$EXPERIMENT_RUN_DIR" ]]; then
            [[ "$EXPERIMENT_STAGE" == "run" ]] || { echo 'A run_dir is required for separate stages'; exit 1; }
            EXPERIMENT_RUN_DIR="$RUNNER_TEMP/translation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "TRANSLATION_RUN_DIR=$EXPERIMENT_RUN_DIR" >> "$GITHUB_ENV"
          if [[ "$EXPERIMENT_STAGE" == "run" || "$EXPERIMENT_STAGE" == "finish" ]]; then
            if [[ "$CREATE_DRAFT" == "true" && "$EXPERIMENT_CONDITION" == "both" ]]; then
              echo 'Choose graph or no-graph for a draft PR'; exit 1
            fi
          fi
          if [[ "${ACT:-}" != "true" && ( "$EXPERIMENT_STAGE" == "prepare" || "$EXPERIMENT_STAGE" == "run" ) ]]; then
            source_revision="$(python3 -c 'import json; print(json.load(open(__import__("os").environ["EXPERIMENT_MANIFEST"]))["source_revision"])')"
            [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]]
            if ! git cat-file -e "$source_revision^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$source_revision"
            fi
          fi
          args=(--stage "$EXPERIMENT_STAGE" --run-dir "$EXPERIMENT_RUN_DIR" --manifest "$EXPERIMENT_MANIFEST")
          if [[ -n "${ATTN_METAL_SITE:-}" ]]; then
            args+=(--target-site "$ATTN_METAL_SITE")
          fi
          if [[ "$EXPERIMENT_PILOT" == "true" ]]; then
            args+=(--pilot)
          fi
          if [[ -n "${EXPERIMENT_BASELINE_RUN:-}" ]]; then
            args+=(--baseline-run "$EXPERIMENT_BASELINE_RUN")
          fi
          args+=(--condition "$EXPERIMENT_CONDITION")
          if [[ "$EXPERIMENT_STAGE" == "finish" || "$EXPERIMENT_STAGE" == "run" ]]; then
            if [[ "$RUN_TESTS" == "false" ]]; then args+=(--skip-tests); fi
            if [[ "$CREATE_DRAFT" == "true" ]]; then
              [[ "$EXPERIMENT_CONDITION" != "both" ]] || { echo 'Choose graph or no-graph for a draft PR'; exit 1; }
              rm -rf -- "$RUNNER_TEMP/attention-tracker-pr"
              args+=(--prepare-pr "$RUNNER_TEMP/attention-tracker-pr")
            fi
          fi
          "${TRANSLATION_PYTHON:-python3}" .github/scripts/translation/run.py "${args[@]}"
      - name: Check publication bundle
        id: bundle
        if: ${{ always() && (inputs.stage == 'finish' || inputs.stage == 'run') && inputs.create_draft_pr && !env.ACT }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/attention-tracker-pr/metadata.json" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload selected candidate
        if: ${{ always() && steps.bundle.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: attention-tracker-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attention-tracker-pr/
          if-no-files-found: error
      - name: Upload experiment evidence
        id: evidence
        if: ${{ always() && !env.ACT && env.TRANSLATION_RUN_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: translation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TRANSLATION_RUN_DIR }}/**/*.json
            ${{ env.TRANSLATION_RUN_DIR }}/**/*.md
            ${{ env.TRANSLATION_RUN_DIR }}/**/*.log
            ${{ env.TRANSLATION_RUN_DIR }}/**/*.patch
            ${{ env.TRANSLATION_RUN_DIR }}/source_only/candidate/**/*.ipynb
            ${{ env.TRANSLATION_RUN_DIR }}/source_validated_dag/candidate/**/*.ipynb
            ${{ env.TRANSLATION_RUN_DIR }}/source_only/candidate/translation_discovery/**
            ${{ env.TRANSLATION_RUN_DIR }}/source_validated_dag/candidate/translation_discovery/**
            ${{ env.TRANSLATION_RUN_DIR }}/shared-context/**
            ${{ env.TRANSLATION_RUN_DIR }}/platform-discovery/**
            ${{ env.TRANSLATION_RUN_DIR }}/target-retrieval/**
            ${{ env.TRANSLATION_RUN_DIR }}/source_dag.mmd
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve experiment failure
        if: ${{ always() && steps.experiment.outcome == 'failure' }}
        run: exit 1

  publish:
    needs: experiment
    if: ${{ always() && (inputs.stage == 'finish' || inputs.stage == 'run') && inputs.create_draft_pr && inputs.condition != 'both' && needs.experiment.outputs.bundle_ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: attention-tracker-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attention-tracker-pr
      - name: Open selected candidate as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ inputs.pr_base }}
          EVIDENCE_URL: ${{ needs.experiment.outputs.evidence_url }}
        run: |
          python3 .github/scripts/translation/publish_candidate.py \
            --bundle "$RUNNER_TEMP/attention-tracker-pr" \
            --repo "$GITHUB_REPOSITORY" --base "$PR_BASE" --artifact-url "$EVIDENCE_URL"
