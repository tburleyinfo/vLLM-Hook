name: Copilot Notebook Translation

on:
  workflow_dispatch:
    inputs:
      source_notebook:
        description: Source notebook to translate from
        required: true
        default: notebooks/demo_spotlight.ipynb
      target_notebook:
        description: Colab notebook to create or refresh
        required: true
        default: notebooks/demo_spotlight_colab.ipynb
      target_branch:
        description: Branch containing the target notebook
        required: true
        default: main
      parity_command:
        description: Command to validate the translated notebook; leave blank to skip
        required: false
        default: "true"
      setup_command:
        description: Optional environment setup command before parity
        required: false
        default: python -m pip install nbformat pytest
      runner:
        description: Runner label
        required: true
        default: macos-latest

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: copilot-notebook-translation-${{ inputs.target_branch }}-${{ inputs.target_notebook }}
  cancel-in-progress: false

jobs:
  translate:
    name: Translate notebook with Copilot
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install Copilot CLI
        shell: bash
        run: npm install -g @github/copilot

      - name: Validate requested paths
        shell: bash
        env:
          SOURCE_NOTEBOOK: ${{ inputs.source_notebook }}
          TARGET_NOTEBOOK: ${{ inputs.target_notebook }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          case "$SOURCE_NOTEBOOK" in
            notebooks/*.ipynb) ;;
            *)
              echo "Source notebook must be under notebooks/: $SOURCE_NOTEBOOK" >&2
              exit 1
              ;;
          esac

          case "$TARGET_NOTEBOOK" in
            notebooks/*.ipynb) ;;
            *)
              echo "Target notebook must be under notebooks/: $TARGET_NOTEBOOK" >&2
              exit 1
              ;;
          esac

          case "$TARGET_NOTEBOOK" in
            notebooks/*/*)
              echo "Target Colab notebook must live directly under notebooks/: $TARGET_NOTEBOOK" >&2
              exit 1
              ;;
            notebooks/*_colab.ipynb) ;;
            *)
              echo "Target notebook must be a Colab notebook named notebooks/*_colab.ipynb: $TARGET_NOTEBOOK" >&2
              exit 1
              ;;
          esac

          if [ -z "$TARGET_BRANCH" ]; then
            echo "Target branch is required" >&2
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET_NOTEBOOK")"

      - name: Retrieve source notebook from main
        shell: bash
        env:
          SOURCE_NOTEBOOK: ${{ inputs.source_notebook }}
          SOURCE_BRANCH: main
        run: |
          set -euo pipefail

          mkdir -p .codex-runtime
          git fetch --no-tags origin "$SOURCE_BRANCH"
          git show "origin/${SOURCE_BRANCH}:${SOURCE_NOTEBOOK}" > .codex-runtime/source-notebook.ipynb

      - name: Run setup command
        if: ${{ inputs.setup_command != '' }}
        shell: bash
        env:
          SETUP_COMMAND: ${{ inputs.setup_command }}
        run: |
          set -euo pipefail
          eval "$SETUP_COMMAND"

      - name: Classify translation risk
        shell: bash
        env:
          TARGET_NOTEBOOK: ${{ inputs.target_notebook }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: main
        run: |
          set -euo pipefail

          python .github/scripts/classify_notebook_translation.py \
            --source-notebook .codex-runtime/source-notebook.ipynb \
            --target-notebook "$TARGET_NOTEBOOK" \
            --source-branch "$SOURCE_BRANCH" \
            --target-branch "$TARGET_BRANCH" \
            --output-json .codex-runtime/notebook-translation-classification.json \
            --output-markdown .codex-runtime/notebook-translation-classification.md

          cat .codex-runtime/notebook-translation-classification.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build Copilot prompt
        shell: bash
        env:
          SOURCE_NOTEBOOK: ${{ inputs.source_notebook }}
          TARGET_NOTEBOOK: ${{ inputs.target_notebook }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: main
          PARITY_COMMAND: ${{ inputs.parity_command }}
        run: |
          set -euo pipefail

          mkdir -p .codex-runtime
          cp .github/prompts/notebook-translation.md .codex-runtime/copilot-notebook-translation.md

          {
            printf '\n## Requested Translation\n\n'
            printf 'Source notebook: `%s` from `%s` (copied to `.codex-runtime/source-notebook.ipynb`)\n' "$SOURCE_NOTEBOOK" "$SOURCE_BRANCH"
            printf 'Target notebook: `%s` on `%s`\n' "$TARGET_NOTEBOOK" "$TARGET_BRANCH"
            printf 'Target platform: `colab`\n'
            printf 'Parity command: `%s`\n\n' "${PARITY_COMMAND:-<skipped>}"
            printf 'Modify `%s` so it is the translated counterpart of `%s`.\n' "$TARGET_NOTEBOOK" "$SOURCE_NOTEBOOK"
            printf '\n## MLR-1 Classification Context\n\n'
            cat .codex-runtime/notebook-translation-classification.md
          } >> .codex-runtime/copilot-notebook-translation.md

      - name: Translate notebook
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            export GITHUB_TOKEN="$COPILOT_GITHUB_TOKEN"
          fi

          copilot -p "$(cat .codex-runtime/copilot-notebook-translation.md)" \
            -s \
            --available-tools='bash,edit,view,grep,glob' \
            --allow-tool='write' \
            --allow-tool='shell(git diff:*)' \
            --allow-tool='shell(git status:*)' \
            --allow-tool='shell(python:*)' \
            --allow-tool='shell(python3:*)' \
            --no-ask-user | tee .codex-runtime/copilot-final-message.md

      - name: Apply canonical Colab setup cell
        shell: bash
        env:
          TARGET_NOTEBOOK: ${{ inputs.target_notebook }}
        run: |
          set -euo pipefail

          python .github/scripts/apply_colab_setup_cell.py \
            --notebook "$TARGET_NOTEBOOK" \
            --template notebooks/snippets/colab_setup.py

      - name: Validate notebook JSON
        shell: bash
        env:
          SOURCE_NOTEBOOK: ${{ inputs.source_notebook }}
          TARGET_NOTEBOOK: ${{ inputs.target_notebook }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import nbformat

          paths = [".codex-runtime/source-notebook.ipynb", os.environ["TARGET_NOTEBOOK"]]
          for path in paths:
              with open(path, encoding="utf-8") as handle:
                  nbformat.read(handle, as_version=4)
              print(f"Validated notebook JSON: {path}")
          PY

      - name: Run parity command
        if: ${{ inputs.parity_command != '' }}
        shell: bash
        env:
          PARITY_COMMAND: ${{ inputs.parity_command }}
        run: |
          set -euo pipefail
          bash -lc "$PARITY_COMMAND"

      - name: Collect translation diff
        if: ${{ always() }}
        shell: bash
        env:
          TARGET_NOTEBOOK: ${{ inputs.target_notebook }}
        run: |
          set -euo pipefail

          mkdir -p .codex-runtime
          git add -N "$TARGET_NOTEBOOK" 2>/dev/null || true
          git status --short > .codex-runtime/git-status.txt
          git diff --binary > .codex-runtime/notebook-translation.patch

          {
            echo "## Copilot Notebook Translation"
            echo
            echo "### Status"
            echo
            echo '```'
            cat .codex-runtime/git-status.txt
            echo '```'
            echo
            echo "### Patch"
            echo
            echo "Download the workflow artifact named \`copilot-notebook-translation\` and review \`notebook-translation.patch\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload translation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: copilot-notebook-translation
          if-no-files-found: warn
          path: |
            .codex-runtime/copilot-final-message.md
            .codex-runtime/copilot-notebook-translation.md
            .codex-runtime/notebook-translation-classification.json
            .codex-runtime/notebook-translation-classification.md
            .codex-runtime/source-notebook.ipynb
            .codex-runtime/git-status.txt
            .codex-runtime/notebook-translation.patch
            ${{ inputs.target_notebook }}
